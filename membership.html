<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tia Membership</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="signup-page">

  <header class="site-header simple-header">
    <a href="index.html"><img src="images/header logo.png" alt="Tia Health" class="site-logo"></a>
    
  </header>

  <main class="signup-wrapper">
    <div class="signup-box">

      <h1>Let’s get your contact info</h1>
      <p class="section-note">
        We need some basic details before checking insurance.
      </p>

      <form class="signup-form">

        <div class="form-row">
          <input type="text" placeholder="First name">
          <input type="text" placeholder="Last name">
        </div>

        <input type="email" placeholder="Email">
        <input type="tel" placeholder="Mobile number">

        <div class="form-row">
          <input type="text" placeholder="Zip code">
          <input type="text" placeholder="MM/DD/YYYY">
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="terms">
          <label for="terms">I agree to the terms and privacy policy</label>
        </div>

        <button disabled>Continue</button>
      </form>

      <p class="helper-text">
        Already a patient? <a href="#">Log in</a>
      </p>

    </div>
  </main>

</body>
</html>
